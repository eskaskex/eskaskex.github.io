<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Эрудит — редкие слова</title>
  <meta name="description" content="Тренажёр умной лексики русского языка: карточки, тесты и умное повторение">
  <meta name="theme-color" content="#4f46e5">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
  <script>
    // тема до первой отрисовки — без «вспышки» светлого интерфейса
    try {
      document.documentElement.dataset.theme = localStorage.getItem('erudit_theme') || 'light';
    } catch (e) { document.documentElement.dataset.theme = 'light'; }
  </script>
</head>
<body>

<header class="topbar">
  <h1>🎓 Эрудит</h1>
  <div class="topbar-right">
    <span id="user-chip" class="user-chip"></span>
    <span id="status" class="status">…</span>
    <button id="btn-theme" class="icon-btn" title="Сменить тему">🌙</button>
    <button id="btn-settings" class="icon-btn" title="Настройки">⚙</button>
  </div>
</header>

<nav class="tabs" id="tabs">
  <button data-tab="study" class="active">Учиться</button>
  <button data-tab="words">Слова</button>
  <button data-tab="stats">Статистика</button>
</nav>

<main>

  <!-- ====== ВХОД ====== -->
  <section id="login" class="login" hidden>
    <div class="panel login-box">
      <h2>Добро пожаловать!</h2>
      <p class="muted" id="login-hint">Как тебя называть?</p>
      <input id="login-name" maxlength="30" placeholder="Ник" autocomplete="off">
      <input id="login-pin" maxlength="20" placeholder="ПИН-код (минимум 4 символа)" autocomplete="off" hidden>
      <button id="login-btn" class="primary big">Начать учиться</button>
    </div>
  </section>

  <!-- ====== УЧИТЬСЯ ====== -->
  <section id="tab-study">
    <div id="study-idle">
      <div class="panel">
        <div id="due-info" class="due-info">Загрузка…</div>

        <!-- набор слов -->
        <div class="scope-row">
          <button class="chip active" data-scope="all">🎲 Все</button>
          <button class="chip" data-scope="fav">⭐ Избранные</button>
          <button class="chip" data-scope="cats">📁 Категории</button>
        </div>
        <div id="scope-cats" class="scope-cats" hidden></div>

        <!-- режим теста -->
        <div class="mode-select">
          <label><input type="radio" name="mode" value="cards" checked> 🃏 Карточки</label>
          <label><input type="radio" name="mode" value="quiz"> ✅ Слово → перевод</label>
          <label><input type="radio" name="mode" value="def"> 🔁 Определение → слово</label>
          <label><input type="radio" name="mode" value="type"> ⌨️ Напиши слово</label>
        </div>

        <button id="btn-start" class="primary big">Начать занятие</button>
        <div id="result"></div>
      </div>
    </div>

    <div id="study-session" hidden>
      <div id="progress" class="progress"></div>
      <div class="panel card-panel">
        <div id="card" class="card"></div>
        <div id="card-actions">
          <div id="answers" class="answers"></div>
          <div class="card-btns">
            <button id="btn-no" class="danger" hidden>✗ Не знал</button>
            <button id="btn-know" class="success" hidden>✓ Знал</button>
          </div>
          <div id="answer-next" class="answer-next" hidden>
            <button id="btn-next" class="primary">Следующее слово →</button>
          </div>
        </div>
      </div>
      <button id="btn-exit" class="ghost">Выйти из занятия</button>
    </div>
  </section>

  <!-- ====== СЛОВА (КАТАЛОГ) ====== -->
  <section id="tab-words" hidden>
    <form id="add-form" class="panel add-form">
      <input id="f-word" placeholder="Слово (например: квинтэссенция)" autocomplete="off" required>
      <input id="f-tr" placeholder="Значение — кратко" autocomplete="off" required>
      <div class="row">
        <input id="f-cat" placeholder="Категория (необязательно)">
        <input id="f-ex" placeholder="Пример употребления (необязательно)">
      </div>
      <button class="primary" type="submit">＋ Добавить слово</button>
    </form>

    <div class="catalog-bar">
      <input id="search" class="search" placeholder="🔍 Поиск слова или значения" autocomplete="off">
      <div class="view-toggle">
        <button id="view-list" title="Список">☰</button>
        <button id="view-grid" title="Сетка">▦</button>
      </div>
    </div>
    <div id="cat-chips" class="cat-chips"></div>
    <div id="word-list"></div>
  </section>

  <!-- ====== СТАТИСТИКА ====== -->
  <section id="tab-stats" hidden>
    <div class="statgrid">
      <div class="panel statcard"><div id="stat-total" class="statnum">0</div><span>📚 всего слов</span></div>
      <div class="panel statcard"><div id="stat-learned" class="statnum ok">0</div><span>✅ освоено</span></div>
      <div class="panel statcard"><div id="stat-learning" class="statnum">0</div><span>🌱 изучается</span></div>
      <div class="panel statcard"><div id="stat-due" class="statnum warn">0</div><span>⏰ к повторению</span></div>
    </div>

    <div class="panel">
      <h3>Как растут слова</h3>
      <p class="muted">Ответил верно — слово переходит в следующую коробку и показывается реже. Ошибка — возвращается в первую коробку.</p>
      <div id="boxes" class="box-rows"></div>
    </div>

    <div class="panel">
      <h3>Самые трудные слова</h3>
      <div id="worst"></div>
    </div>

    <button id="btn-reset" class="ghost danger-outline">Сбросить весь прогресс</button>
  </section>

</main>

<!-- ====== ПОЛНАЯ КАРТОЧКА СЛОВА ====== -->
<div id="word-modal" class="modal" hidden>
  <div class="modal-box word-full" id="word-full"></div>
</div>

<!-- ====== МОДАЛКА ДАННЫХ ====== -->
<div id="modal" class="modal" hidden>
  <div class="modal-box">
    <h2>⚙ Данные</h2>
    <p id="modal-msg" class="muted"></p>
    <div class="modal-actions">
      <button id="btn-export" class="primary">⬇ Скачать копию (прогресс + своё)</button>
      <button id="btn-import" class="ghost">⬆ Загрузить копию</button>
      <button id="btn-logout" class="ghost">🚪 Сменить пользователя</button>
      <button id="modal-close" class="ghost">Закрыть</button>
    </div>
    <input id="file-import" type="file" accept=".json,application/json" hidden>
  </div>
</div>

<script src="js/cloud-config.js"></script>
<script src="js/app.js"></script>
</body>
</html>
